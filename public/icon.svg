<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />

  <!-- Inner calendar board container -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <rect width="384" height="384" rx="48" fill="#ffffff" />
    
    <!-- Header band -->
    <path d="M 0 48 Q 0 0 48 0 L 336 0 Q 384 0 384 48 L 384 96 L 0 96 Z" fill="#2563eb" />
    
    <!-- Calendar Rings -->
    <rect x="88" y="-14" width="24" height="42" rx="12" fill="#93c5fd" />
    <rect x="272" y="-14" width="24" height="42" rx="12" fill="#93c5fd" />

    <!-- Calendar Grid Shifts (Roster rows) -->
    <!-- Row 1 -->
    <rect x="44" y="132" width="120" height="48" rx="10" fill="#dbeafe" />
    <rect x="176" y="132" width="164" height="48" rx="10" fill="#fef3c7" />
    <circle cx="70" cy="156" r="12" fill="#3b82f6" />
    <rect x="94" y="150" width="54" height="12" rx="6" fill="#2563eb" />
    <circle cx="202" cy="156" r="12" fill="#f59e0b" />
    <rect x="226" y="150" width="80" height="12" rx="6" fill="#d97706" />

    <!-- Row 2 -->
    <rect x="44" y="200" width="170" height="48" rx="10" fill="#d1fae5" />
    <rect x="226" y="200" width="114" height="48" rx="10" fill="#ede9fe" />
    <circle cx="70" cy="224" r="12" fill="#10b981" />
    <rect x="94" y="218" width="86" height="12" rx="6" fill="#059669" />
    <circle cx="252" cy="224" r="12" fill="#8b5cf6" />
    <rect x="276" y="218" width="48" height="12" rx="6" fill="#7c3aed" />

    <!-- Row 3 -->
    <rect x="44" y="268" width="140" height="48" rx="10" fill="#e0e7ff" />
    <rect x="196" y="268" width="144" height="48" rx="10" fill="#dbeafe" />
    <circle cx="70" cy="292" r="12" fill="#6366f1" />
    <rect x="94" y="286" width="70" height="12" rx="6" fill="#4f46e5" />
    <circle cx="222" cy="292" r="12" fill="#3b82f6" />
    <rect x="246" y="286" width="72" height="12" rx="6" fill="#2563eb" />

    <!-- Bottom Check Sync Indicator -->
    <circle cx="320" cy="328" r="28" fill="#10b981" />
    <path d="M 308 328 L 316 336 L 332 320" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
